# Standard CI for a repo hosted on the Moline app platform (moline-platform templates/ci.yml).
# No secrets, nothing here deploys: the platform deploys a default-branch commit whose runs all pass.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Every source file parses
        run: for f in server.js includes/*.js views/scripts/*.js; do node --check "$f"; done
      - run: npm test --if-present
      - name: Settings schema is valid (Varlock, dummy values, no secrets)
        run: |
          WISE_TELEMETRY_USERNAME=dummy-user-0001 WISE_TELEMETRY_PASSWORD=dummy-secret-0001 \
          WISE_TELEMETRY_ACCOUNT_ID=dummy-account-01 WISE_TELEMETRY_DEVICE_ID=dummy-device-001 \
          VISUAL_CROSSING_API_KEY=dummy-secret-0002 VISUAL_CROSSING_LATITUDE=41.5 VISUAL_CROSSING_LONGITUDE=-88.3 \
          npx -y varlock@1 load > /dev/null
  image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      IMAGE: app:ci
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
      - name: The image runs as non-root and answers /health with an empty database and an empty /xml
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -x "$PUPPETEER_EXECUTABLE_PATH"'
          mkdir -p empty-xml
          docker run -d --name app -e PORT="$PORT" -v "$PWD/empty-xml:/xml:ro" "$IMAGE"
          for i in $(seq 1 30); do docker exec app curl -fsS "http://127.0.0.1:$PORT/health" && break; sleep 2; done
          docker exec app curl -fsS "http://127.0.0.1:$PORT/health"
          echo; docker exec app curl -sS "http://127.0.0.1:$PORT/health/deep"
          echo; docker exec app curl -sS -o /dev/null -w 'POST /enumerateXML without a secret: %{http_code}\n' -X POST "http://127.0.0.1:$PORT/enumerateXML" || true
          docker logs app | head -20
          docker rm -f app
